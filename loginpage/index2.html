<html lang="en">
  <head>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" type="text/css" href="style2.css" />

    <title>Hello, world!</title>
  </head>

  <body>
    <!--Main container-->
    <div class="container-fluid">
      <div class="row">
        <div class="col-12 col-lg-4">
          <img
            class="img-fluid w-100"
            src="./assets/images/download forest.jpg"
            alt=""
          />
        </div>
        <div class="col-12 col-lg-8 bg_right">
          <div class="px-5">
            <h3 class="text-center">Join the Summer Adventure Challenge</h3>
            <p class="text-center">
              Sign up to embark on an unforgettable outdoor experience.
            </p>

            <div>
              <form action="">
                <div class="row">
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">First Name</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">Last Name</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">E-mail Address</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">Phone Number</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">City</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="form-group col-12 col-md-6 my-2">
                    <label for="exampleInputEmail1">State</label>
                    <input
                      type="email"
                      class="form-control w-100 border-0 inp"
                    />
                  </div>
                  <div class="col-md-12 my-2">
                    <p>Select your prefferred adventure:</p>
                    <div class="d-flex flex-column flex-md-row">
                      <div class="mx-2 my-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="flexRadioDefault"
                          id="flexRadioDefault2"
                          checked
                        />
                        <label class="form-check-label" for="flexRadioDefault2">
                          Hiking
                        </label>
                      </div>
                      <div class="mx-2 my-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="flexRadioDefault"
                          id="flexRadioDefault2"
                          checked
                        />
                        <label class="form-check-label" for="flexRadioDefault2">
                          Kayaking
                        </label>
                      </div>
                      <div class="mx-2 my-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="flexRadioDefault"
                          id="flexRadioDefault2"
                          checked
                        />
                        <label class="form-check-label" for="flexRadioDefault2">
                          Rock Climbing
                        </label>
                      </div>
                      <div class="mx-2 my-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="flexRadioDefault"
                          id="flexRadioDefault2"
                          checked
                        />
                        <label class="form-check-label" for="flexRadioDefault2">
                          Mountain Biking
                        </label>
                      </div>
                      <div class="mx-2 my-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="flexRadioDefault"
                          id="flexRadioDefault2"
                          checked
                        />
                        <label class="form-check-label" for="flexRadioDefault2">
                          Camping
                        </label>
                      </div>
                    </div>
                    <div class="my-2">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="inlineFormCheck"
                      />
                      <label class="form-check-label" for="inlineFormCheck">
                        By signing up, you agree to our terms and conditions
                      </label>
                    </div>
                  </div>
                  <div class="col-12 col-md-6 my-2">
                    <button class="btn canBtn w-100 py-3">Cancel</button>
                  </div>
                  <div class="col-12 col-md-6 my-2">
                    <button class="btn subBtn w-100 py-3">Submit</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--type script-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
      integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
